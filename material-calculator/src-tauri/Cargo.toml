[package]
name = "material-calculator"
version = "1.0.0"
description = "A fast, full-featured Material Design 3 calculator built with Tauri 2"
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "material_calculator_lib"
