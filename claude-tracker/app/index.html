<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Claude Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Áp dụng giao diện đã lưu trước khi React chạy -> không bị nháy sáng/tối khi mở app
      try {
        var p = JSON.parse(localStorage.getItem("claude-tracker.prefs") || "{}");
        var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.font = p.font === "xl" ? "lg" : p.font || "md";
        document.documentElement.dataset.accent = p.accent || "terracotta";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
