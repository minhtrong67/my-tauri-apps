[package]
name = "claude-tracker"
version = "0.2.0"
description = "Track Claude usage limits across multiple Chrome profiles"
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
