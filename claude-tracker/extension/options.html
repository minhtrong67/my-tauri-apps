<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Claude Tracker Reporter</title><link rel="stylesheet" href="ui.css" />
<style>
  main { max-width: 560px; margin: 36px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
  h2 { font-size: 14px; margin: 0 0 4px; }
  #conn { margin-top: 12px; font-size: 13px; }
  details summary { cursor: pointer; font-weight: 600; }
  pre { white-space: pre-wrap; font-size: 12px; background: var(--soft); padding: 10px; border-radius: 9px; display: none; max-height: 320px; overflow: auto; }
  .token { position: relative; } .token button { position: absolute; right: 6px; top: 6px; padding: 3px 9px; font-size: 12px; }
</style></head>
<body><main>
  <div class="brand"><img src="icons/48.png" alt="" /><div><b>Claude Tracker Reporter</b><span data-i="optSub"></span></div></div>

  <section class="card">
    <h2 data-i="connTitle"></h2>
    <p class="hint" style="margin-top:0" data-i="connHint"></p>
    <label for="port" data-i="port"></label><input id="port" type="number" />
    <label for="token" data-i="token"></label>
    <div class="token"><input id="token" type="password" autocomplete="off" /><button class="btn" id="eye" type="button" data-i="show"></button></div>
    <label for="intervalMin" data-i="interval"></label><input id="intervalMin" type="number" min="1" />
    <div class="row" style="margin-top:16px"><button class="btn primary" id="save" data-i="save"></button><button class="btn" id="test" data-i="test"></button></div>
    <div id="conn"></div>
  </section>

  <section class="card">
    <label for="lang" data-i="lang"></label><select id="lang"><option value="auto" data-i="auto"></option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
  </section>

  <section class="card">
    <h2 data-i="detected"></h2>
    <dl class="kv" id="info"></dl>
  </section>

  <section class="card">
    <details><summary data-i="adv"></summary>
      <p class="hint" data-i="advHint"></p>
      <button class="btn" id="probe" data-i="probe"></button>
      <pre id="out"></pre>
    </details>
  </section>
<script src="i18n.js"></script><script src="options.js"></script></main></body></html>
