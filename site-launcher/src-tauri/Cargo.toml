[package]
name = "site-launcher"
version = "0.1.0"
description = "Open browser profiles with the websites you choose, in one click"
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
