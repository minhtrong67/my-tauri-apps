*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font:400 16px/1.6 var(--f);color:var(--tx);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}img{max-width:100%;height:auto;display:block}
.ic{width:24px;height:24px;flex:none}
.wrap{width:min(1120px,100% - 40px);margin:0 auto}
:focus-visible{outline:2px solid var(--p);outline-offset:3px;border-radius:8px}
/* top app bar */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.sc{border-color:var(--olv)}
.bar{display:flex;align-items:center;gap:8px;height:64px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px;margin-right:auto}.brand svg{width:36px;height:36px}
nav.links{display:flex;gap:4px}nav.links a{padding:8px 16px;border-radius:20px;font-weight:500;font-size:14px;color:var(--tx2);transition:background .2s,color .2s}nav.links a:hover{background:var(--s3);color:var(--tx)}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--tx2);display:grid;place-items:center;cursor:pointer;transition:background .2s}.ib:hover{background:var(--s3)}
.lg{border:1px solid var(--ol);border-radius:20px;height:36px;padding:0 14px;background:transparent;color:var(--tx);font:500 13px var(--f);cursor:pointer}.lg:hover{background:var(--s3)}
.menu-b{display:none}
/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 28px;border:0;border-radius:24px;font:500 15px var(--f);letter-spacing:.1px;cursor:pointer;transition:transform .2s var(--e),box-shadow .2s,background .2s}
.btn.f{background:var(--p);color:var(--on-p)}.btn.f:hover{box-shadow:0 4px 14px color-mix(in srgb,var(--p) 40%,transparent);transform:translateY(-2px)}
.btn.t{background:var(--sc);color:var(--on-sc)}.btn.t:hover{transform:translateY(-2px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn:active{transform:scale(.96)}.btn.big{height:56px;padding:0 36px;font-size:16px;border-radius:28px}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rip .6s var(--e) forwards;pointer-events:none}@keyframes rip{to{transform:scale(1);opacity:0}}
/* hero */
.hero{position:relative;padding:72px 0 40px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-1;animation:drift 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--pc);top:-120px;left:-100px}.b2{width:360px;height:360px;background:color-mix(in srgb,var(--cy) 30%,transparent);right:-80px;top:80px;animation-delay:-5s}.b3{width:300px;height:300px;background:var(--tc);left:40%;bottom:-120px;animation-delay:-9s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
.hgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:16px;background:var(--pc);color:var(--on-pc);font-size:13px;font-weight:500}.tag .ic{width:18px;height:18px}
h1{margin:20px 0 16px;font:400 clamp(34px,5.4vw,60px)/1.1 var(--f);letter-spacing:-.5px}h1 b{display:block;font-weight:600;background:linear-gradient(90deg,var(--p),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;color:var(--tx2);max-width:540px;margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;color:var(--tx2);font-size:14px}.meta span{display:inline-flex;align-items:center;gap:8px}.meta .ic{width:18px;height:18px;color:var(--p)}
.win{border-radius:18px;background:var(--s3);padding:10px;box-shadow:0 24px 60px -18px rgba(0,0,0,.35),0 0 0 1px var(--olv);animation:float 6s ease-in-out infinite;transform-origin:center}
.win .dots{display:flex;gap:6px;padding:2px 6px 10px}.win .dots i{width:10px;height:10px;border-radius:50%;background:var(--ol);opacity:.5}
.win img{border-radius:10px;width:100%}
@keyframes float{50%{transform:translateY(-10px) rotate(-.4deg)}}
/* sections */
section{padding:84px 0}.hd{text-align:center;max-width:640px;margin:0 auto 48px}.hd h2{margin:0 0 12px;font:400 clamp(28px,4vw,40px)/1.2 var(--f)}.hd p{margin:0;color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{padding:24px;border-radius:24px;background:var(--s2);transition:transform .3s var(--e),background .3s,box-shadow .3s}.card:hover{transform:translateY(-6px);background:var(--s3);box-shadow:0 12px 28px -12px rgba(0,0,0,.25)}
.ficon{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--pc);color:var(--on-pc);margin-bottom:16px;transition:transform .4s var(--e),border-radius .3s}.card:hover .ficon{transform:rotate(-8deg) scale(1.08);border-radius:50%}
.card h3{margin:0 0 6px;font:500 18px/1.3 var(--f)}.card p{margin:0;color:var(--tx2);font-size:14.5px}
.alt{background:var(--s1)}
.tabs{display:flex;gap:8px;overflow-x:auto;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.tab{height:36px;padding:0 18px;border-radius:12px;border:1px solid var(--ol);background:transparent;color:var(--tx2);font:500 14px var(--f);cursor:pointer;transition:all .25s var(--e)}.tab:hover{background:var(--s3)}.tab.on{background:var(--sc);color:var(--on-sc);border-color:transparent}
.stage{position:relative;width:min(960px,100%);margin:0 auto;border-radius:20px;background:var(--s3);padding:12px;box-shadow:0 24px 60px -24px rgba(0,0,0,.4),0 0 0 1px var(--olv);aspect-ratio:1280/800;aspect-ratio:auto}
.stage-in{position:relative;aspect-ratio:1280/800;border-radius:10px;overflow:hidden}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity .5s var(--e),transform .6s var(--e);cursor:zoom-in}.shot.on{opacity:1;transform:none}
.dlbox{position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--cy) 28%,var(--pc)));color:var(--on-pc);padding:56px 32px;text-align:center}
.dlbox .logo{width:88px;height:88px;margin:0 auto 20px;filter:drop-shadow(0 10px 22px color-mix(in srgb,var(--cy) 50%,transparent));animation:float 5s ease-in-out infinite}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px auto 0;max-width:820px;text-align:left}
.step{padding:18px 20px;border-radius:20px;background:color-mix(in srgb,var(--bg) 55%,transparent)}.step b{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--tx)}.step b i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--p);color:var(--on-p);font:600 13px var(--f);font-style:normal}.step span{display:block;margin-top:6px;font-size:14px;color:var(--tx2)}
.req{margin-top:20px;font-size:13px;color:var(--tx2);text-align:center}
footer{padding:36px 0 48px;text-align:center;color:var(--tx2);font-size:14px}
.who{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:10px}
.hl{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:16px;font-weight:600;font-size:14px;color:var(--tx)}.hl .ic{width:18px;height:18px}
.hl.a{background:linear-gradient(135deg,var(--p),#705575);color:var(--on-p)}.hl.c{background:color-mix(in srgb,#d97757 20%,var(--bg));box-shadow:inset 0 0 0 1.5px #d97757}.hl.c .ic{color:#d97757}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(0,0,0,.8);padding:20px;cursor:zoom-out}.lb.on{display:grid;animation:fade .25s ease both}.lb img{max-height:92vh;border-radius:12px;animation:pop .35s var(--e) both}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
/* reveal on scroll */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s var(--e) var(--d,0ms),transform .7s var(--e) var(--d,0ms)}.reveal.in{opacity:1;transform:none}
.hero .tag,.hero h1,.hero .lead,.hero .cta,.hero .meta,.hero .win{animation:up .8s var(--e) both}.hero h1{animation-delay:.08s}.hero .lead{animation-delay:.16s}.hero .cta{animation-delay:.24s}.hero .meta{animation-delay:.32s}.hero .win{animation:up .9s .2s var(--e) both,float 6s 1.1s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
@media(max-width:960px){.hgrid{grid-template-columns:1fr;text-align:center}.lead{margin-inline:auto}.cta,.meta{justify-content:center}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding-top:40px}}
@media(max-width:720px){nav.links{position:absolute;top:64px;left:0;right:0;flex-direction:column;padding:8px 20px 16px;background:var(--bg);border-bottom:1px solid var(--olv);display:none}nav.links.open{display:flex;animation:fade .2s both}nav.links a{padding:12px 16px}.menu-b{display:grid}section{padding:56px 0}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.dlbox{padding:40px 20px;border-radius:24px}.btn.big{width:100%}.win{padding:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
</style>
