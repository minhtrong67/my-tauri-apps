[package]
name = "fluent-mp3"
version = "0.5.0"
description = "Fluent MP3 - download MP3 from YouTube, TikTok and Spotify (Microsoft Fluent Design)"
license = "MIT"
authors = ["minhtrong67"]
edition = "2021"

[lib]
name = "fluent_mp3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
arboard = { version = "3", default-features = false }
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Mica / Mica Alt / Acrylic (Windows 10 1809+ / Windows 11)
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
