[package]
name = "material-video-downloader"
version = "1.1.0"
description = "A Material Design 3 desktop video downloader with a companion Chrome extension."
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "material_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "deflate"] }
futures-util = "0.3"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
