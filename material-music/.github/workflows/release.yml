name: Release

# Push a tag such as v1.3.0 (it must match the version in package.json) to build the installer and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm run portable
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            download/Material-Music_*_x64-setup.exe
            download/Material-Music_*_x64-portable.zip
