name: Release

# Push a tag such as v1.3.0 (it must match the version in package.json) to build, sign and publish the installer.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build, sign and create the update manifest
        env:
          # Settings → Secrets: the contents of the private key file created with `npx tauri signer generate`
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # the update manifest points to the site that hosts download/ (see plugins.updater.endpoints); set UPDATE_BASE_URL here to host elsewhere
        shell: bash
        run: npm run release -- "Material Music ${GITHUB_REF_NAME#v}"
      - run: npm run portable
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            download/Material-Music_*_x64-setup.exe
            download/Material-Music_*_x64-portable.zip
            download/latest.json
