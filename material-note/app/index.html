<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Material Note</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      /* Apply the saved scheme before first paint so the window never flashes. */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("material-note.settings") || "{}");
          var m = s.theme || "system";
          var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.scheme = dark ? "dark" : "light";
          document.documentElement.style.background = dark ? "#141218" : "#fef7ff";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
