<style>
:root{
  --ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --md-primary:#592dff;--md-on-primary:#fff;--md-primary-container:#e5deff;--md-on-primary-container:#4100db;
  --md-secondary:#625b71;--md-on-secondary:#fff;--md-secondary-container:#eddcff;--md-on-secondary-container:#2b2339;
  --md-tertiary:#74527e;--md-on-tertiary:#fff;--md-tertiary-container:#fad7ff;--md-on-tertiary-container:#5b3a65;
  --md-error:#ba1a1a;--md-on-error:#fff;--md-error-container:#ffdad6;--md-on-error-container:#410002;
  --md-surface:#fcf8ff;--md-on-surface:#1c1b20;--md-surface-variant:#e6e0ec;--md-on-surface-variant:#48454f;
  --md-surface-container-lowest:#fff;--md-surface-container-low:#f7f1ff;--md-surface-container:#f1ebf9;
  --md-surface-container-high:#ebe5f3;--md-surface-container-highest:#e5dfee;
  --md-outline:#79757f;--md-outline-variant:#cac4d0;--md-inverse-surface:#313036;--md-inverse-on-surface:#f4eff7;--md-scrim:#000;
  --r-xl:28px;--nav-h:68px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px);-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--md-surface);color:var(--md-on-surface);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.no-anim *{transition:none!important}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--md-primary);outline-offset:3px;border-radius:12px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* state layer + ripple */
.ripple{position:relative;overflow:hidden;isolation:isolate}
.ripple::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;z-index:-1;border-radius:inherit}
.ripple:hover::after{opacity:.08}.ripple:active::after{opacity:.12}
.wave{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:wave .65s var(--ease) forwards;pointer-events:none;z-index:-1}
@keyframes wave{to{transform:scale(1);opacity:0}}

/* buttons: pill that morphs to a squircle on press */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;height:3.25rem;padding:0 1.75rem;border-radius:999px;font-weight:700;font-size:1rem;white-space:nowrap;transition:border-radius .3s var(--spring),transform .3s var(--spring),box-shadow .2s,background-color .2s}
.btn:hover{border-radius:18px}.btn:active{border-radius:14px;transform:scale(.96)}
.btn-fill{background:var(--md-primary);color:var(--md-on-primary);box-shadow:0 2px 8px color-mix(in srgb,var(--md-primary) 40%,transparent)}
.btn-fill:hover{box-shadow:0 6px 22px color-mix(in srgb,var(--md-primary) 50%,transparent)}
.btn-tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn-outline{box-shadow:inset 0 0 0 1.5px var(--md-outline);color:var(--md-primary)}
.btn-sm{height:2.5rem;padding:0 1.2rem;font-size:.875rem}
.icon-btn{display:inline-grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:999px;color:var(--md-on-surface-variant);transition:border-radius .3s var(--spring),transform .3s var(--spring),background-color .2s}
.icon-btn:active{border-radius:12px;transform:scale(.9)}
.icon-btn[aria-pressed=true],.icon-btn.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-radius:14px}

/* tooltip */
[data-tip]{position:relative}
[data-tip]::before{content:attr(data-tip);position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,-4px) scale(.95);background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);padding:.35rem .7rem;border-radius:10px;font-size:.75rem;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s .3s,transform .2s var(--spring) .3s;z-index:90}
[data-tip]:hover::before,[data-tip]:focus-visible::before{opacity:1;transform:translate(-50%,0) scale(1)}
[data-tip-pos=top]::before{top:auto;bottom:calc(100% + 10px)}
@media(hover:none){[data-tip]::before{display:none}}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:80;height:var(--nav-h);display:flex;align-items:center;transition:background-color .3s,box-shadow .3s,backdrop-filter .3s}
.nav.scrolled{background:color-mix(in srgb,var(--md-surface) 82%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 1px 0 var(--md-outline-variant)}
.nav .wrap{display:flex;align-items:center;gap:.75rem}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:800;font-size:1.1rem;letter-spacing:-.01em;margin-right:auto}
.brand img{width:36px;height:36px;transition:transform .6s var(--spring)}.brand:hover img{transform:rotate(36deg) scale(1.1)}
.links{display:flex;gap:.25rem}
.links a{padding:.5rem 1rem;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--md-on-surface-variant);transition:background-color .2s,color .2s,border-radius .3s var(--spring)}
.links a:hover{background:var(--md-surface-container-high)}
.links a.active{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-radius:14px}
.seg{display:inline-flex;gap:2px;padding:0}
.seg button{height:2.5rem;padding:0 .9rem;font-weight:700;font-size:.8rem;background:var(--md-surface-container-high);color:var(--md-on-surface-variant);border-radius:8px;transition:border-radius .3s var(--spring),background-color .2s,transform .2s}
.seg button:first-child{border-radius:999px 8px 8px 999px}.seg button:last-child{border-radius:8px 999px 999px 8px}
.seg button[aria-checked=true]{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-radius:999px}
.seg button:active{transform:scale(.94)}
.menu-btn{display:none}
.pop{position:absolute;top:calc(100% + 10px);right:20px;width:min(21rem,calc(100vw - 32px));background:var(--md-surface-container-high);border-radius:var(--r-xl);padding:1.1rem;box-shadow:0 8px 32px rgb(0 0 0/.22);transform-origin:top right;opacity:0;visibility:hidden;transform:scale(.9) translateY(-8px);transition:opacity .2s,transform .3s var(--spring),visibility .2s}
.pop.open{opacity:1;visibility:visible;transform:none}
.pop h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--md-on-surface-variant);margin:.2rem 0 .6rem}
.pop h4:not(:first-child){margin-top:1.1rem}
.modes{display:flex;gap:2px}.modes .seg-b{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;height:2.6rem;font-weight:700;font-size:.82rem;background:var(--md-surface-container-highest);border-radius:8px;transition:border-radius .3s var(--spring),background-color .2s}
.modes .seg-b:first-child{border-radius:999px 8px 8px 999px}.modes .seg-b:last-child{border-radius:8px 999px 999px 8px}
.modes .seg-b[aria-checked=true]{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-radius:999px}
.swatches{display:flex;flex-wrap:wrap;gap:.6rem}
.sw{width:2.6rem;height:2.6rem;border-radius:999px;display:grid;place-items:center;color:#fff;transition:border-radius .3s var(--spring),transform .25s var(--spring),box-shadow .2s}
.sw:hover{transform:scale(1.12)}.sw:active{transform:scale(.9)}
.sw svg{opacity:0;transform:scale(.4);transition:.3s var(--spring)}
.sw[aria-checked=true]{border-radius:14px;box-shadow:0 0 0 3px var(--md-surface-container-high),0 0 0 5px var(--md-on-surface)}
.sw[aria-checked=true] svg{opacity:1;transform:none}

/* hero */
.hero{position:relative;padding:calc(var(--nav-h) + 3.5rem) 0 5rem;overflow:hidden}
.blob{position:absolute;filter:blur(60px);opacity:.55;pointer-events:none;animation:morph 16s ease-in-out infinite,drift 22s ease-in-out infinite}
.b1{width:420px;height:420px;background:var(--md-primary-container);top:-80px;left:-120px}
.b2{width:360px;height:360px;background:var(--md-tertiary-container);top:120px;right:-100px;animation-delay:-6s}
.b3{width:300px;height:300px;background:var(--md-secondary-container);bottom:-120px;left:36%;animation-delay:-11s}
@keyframes morph{0%,100%{border-radius:42% 58% 60% 40%/45% 40% 60% 55%}50%{border-radius:60% 40% 38% 62%/58% 60% 40% 42%}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(36px,-28px,0)}}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:3rem;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 1rem .4rem .5rem;border-radius:999px;background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);font-weight:700;font-size:.82rem}
.chip i{display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:999px;background:var(--md-tertiary);color:var(--md-on-tertiary)}
h1{font-size:clamp(2.5rem,6vw,4.6rem);line-height:1.04;letter-spacing:-.035em;font-weight:900;margin:1.2rem 0 1.2rem}
h1 .w{display:inline-block;opacity:0;transform:translateY(.6em) rotate(3deg);animation:word .8s var(--spring) forwards}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--md-primary),var(--md-tertiary) 70%,var(--md-primary));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes word{to{opacity:1;transform:none}}@keyframes shine{to{background-position:200% center}}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--md-on-surface-variant);max-width:36rem}
.cta{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2rem}
.meta{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;margin-top:1.4rem;font-size:.85rem;color:var(--md-on-surface-variant);font-weight:600}
.meta span{display:inline-flex;align-items:center;gap:.4rem}
.shot{position:relative;perspective:1400px}
.frame{position:relative;border-radius:var(--r-xl);background:var(--md-surface-container-lowest);padding:.6rem;box-shadow:0 24px 70px color-mix(in srgb,var(--md-primary) 28%,transparent),0 4px 14px rgb(0 0 0/.12);transform:rotateY(-7deg) rotateX(3deg);transition:transform .25s ease-out;will-change:transform}
.frame img{border-radius:20px;width:100%;aspect-ratio:1280/800;object-fit:cover;background:var(--md-surface-container)}
.cookie{position:absolute;width:92px;right:-24px;top:-38px;animation:float 7s ease-in-out infinite;filter:drop-shadow(0 8px 14px color-mix(in srgb,var(--md-primary) 40%,transparent))}
.cookie2{position:absolute;width:56px;left:-22px;bottom:-18px;animation:float 9s ease-in-out -3s infinite;opacity:.9}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(10deg)}}

/* marquee */
.marquee{overflow:hidden;padding:1rem 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:.8rem;width:max-content;animation:scroll 38s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{display:inline-flex;align-items:center;gap:.6rem;padding:.55rem 1.1rem;border-radius:999px;background:var(--md-surface-container);font-weight:600;font-size:.9rem;white-space:nowrap}
kbd{font:inherit;font-size:.74rem;font-weight:800;padding:.15rem .5rem;border-radius:8px;background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* sections */
section{padding:5.5rem 0;position:relative}
.eyebrow{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--md-primary);margin-bottom:.8rem}
h2{font-size:clamp(1.9rem,4vw,3rem);line-height:1.1;letter-spacing:-.03em;font-weight:900;max-width:22ch}
.sub{margin-top:1rem;color:var(--md-on-surface-variant);font-size:1.1rem;max-width:42rem}
.head{margin-bottom:3rem}

/* features */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
.card{position:relative;padding:1.8rem;background:var(--md-surface-container-low);border-radius:var(--r-xl);overflow:hidden;transition:transform .4s var(--spring),border-radius .5s var(--spring),background-color .3s}
.card:nth-child(4n+1){border-radius:var(--r-xl) 56px var(--r-xl) var(--r-xl)}.card:nth-child(4n+3){border-radius:56px var(--r-xl) var(--r-xl) var(--r-xl)}
.card:hover{transform:translateY(-8px);border-radius:var(--r-xl);background:var(--md-surface-container)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--md-primary) 16%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.ico{display:grid;place-items:center;width:3.4rem;height:3.4rem;border-radius:18px;background:var(--md-primary-container);color:var(--md-on-primary-container);margin-bottom:1.1rem;transition:transform .5s var(--spring),border-radius .5s var(--spring)}
.card:hover .ico{transform:rotate(-8deg) scale(1.1);border-radius:50%}
.ico svg{width:1.6rem;height:1.6rem}
.card h3{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
.card p{color:var(--md-on-surface-variant);font-size:.96rem}

/* gallery */
.gallery{background:var(--md-surface-container-low);border-radius:48px;padding:2.5rem}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.6rem}
.tab{height:2.8rem;padding:0 1.3rem;border-radius:999px;font-weight:700;font-size:.92rem;background:var(--md-surface-container-high);color:var(--md-on-surface-variant);transition:border-radius .3s var(--spring),background-color .2s,transform .2s}
.tab:hover{border-radius:16px}.tab[aria-selected=true]{background:var(--md-primary);color:var(--md-on-primary);border-radius:16px}
.stage{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--md-surface-container-lowest);box-shadow:0 16px 50px rgb(0 0 0/.16)}
.stage img{width:100%;aspect-ratio:1280/800;object-fit:cover;animation:swap .6s var(--spring)}
@keyframes swap{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.cap{margin-top:1.1rem;color:var(--md-on-surface-variant);font-weight:600;min-height:1.6rem}

/* themes demo */
.demo{display:grid;grid-template-columns:1fr 1.15fr;gap:2.5rem;align-items:center}
.mini{background:var(--md-surface);border-radius:var(--r-xl);box-shadow:0 20px 60px color-mix(in srgb,var(--md-primary) 25%,transparent),0 0 0 1px var(--md-outline-variant);overflow:hidden;transition:background-color .4s}
.mini .bar{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem}
.mini .bar img{width:26px}.mini .bar b{font-size:.85rem}.mini .bar .sp{flex:1}
.mini .dot{width:26px;height:26px;border-radius:50%;background:var(--md-surface-container-high)}.mini .dot.p{background:var(--md-secondary-container)}
.mini .tabsr{display:flex;gap:.4rem;padding:0 1rem .7rem}.mini .t{padding:.3rem .8rem;border-radius:999px;font-size:.72rem;font-weight:700}
.mini .t.a{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-radius:10px}
.mini .t:not(.a){color:var(--md-on-surface-variant)}
.mini .body{margin:0 .7rem .7rem;border-radius:22px;background:var(--md-surface-container-lowest);padding:1.2rem;min-height:210px;position:relative}
.ln{height:9px;border-radius:9px;background:var(--md-surface-container-highest);margin:.7rem 0}
.ln.h{background:var(--md-primary-container);width:46%;height:12px}
.mini mark{background:color-mix(in srgb,var(--md-tertiary) 34%,transparent);border-radius:6px;display:inline-block;height:9px;width:28%;vertical-align:middle;margin:0 .3rem}
.mini .fab{position:absolute;right:1rem;bottom:1rem;padding:.55rem 1rem;border-radius:16px;background:var(--md-primary);color:var(--md-on-primary);font-weight:800;font-size:.78rem;display:flex;gap:.4rem;align-items:center}
.demo-ctl{display:flex;flex-direction:column;gap:1.4rem}
.demo-ctl h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--md-on-surface-variant);margin-bottom:.7rem}

/* download */
.dl{position:relative;overflow:hidden;border-radius:56px;padding:clamp(2rem,6vw,4.5rem);background:var(--md-primary-container);color:var(--md-on-primary-container);text-align:center}
.dl .ring{position:absolute;border-radius:50%;border:2px solid color-mix(in srgb,var(--md-primary) 25%,transparent);animation:pulse 5s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:.9}to{transform:scale(1.6);opacity:0}}
.dl h2{margin-inline:auto;max-width:18ch}.dl .sub{margin-inline:auto;color:inherit;opacity:.8}
.dl .cta{justify-content:center;position:relative}
.dl .btn-fill{height:3.75rem;padding:0 2.4rem;font-size:1.1rem}
.small{font-size:.85rem;opacity:.8;margin-top:1.1rem;position:relative}

/* footer */
footer{padding:3rem 0 4rem}
.credit{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;padding:1.2rem 1.6rem;border-radius:var(--r-xl);background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);position:relative;overflow:hidden}
.credit .heart{display:grid;place-items:center;width:3rem;height:3rem;border-radius:16px;background:var(--md-tertiary);color:var(--md-on-tertiary);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}}
.credit p{flex:1;min-width:14rem;font-size:1rem}
.credit b{background:color-mix(in srgb,currentColor 14%,transparent);padding:.1rem .5rem;border-radius:8px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;margin-top:1.6rem;color:var(--md-on-surface-variant);font-size:.9rem}
.foot a{font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* scroll to top + reveal */
#top{position:fixed;right:22px;bottom:22px;z-index:70;width:3.4rem;height:3.4rem;border-radius:18px;background:var(--md-primary-container);color:var(--md-on-primary-container);display:grid;place-items:center;box-shadow:0 6px 20px rgb(0 0 0/.25);opacity:0;transform:translateY(24px) scale(.7);pointer-events:none;transition:opacity .25s,transform .4s var(--spring),border-radius .3s var(--spring)}
#top.show{opacity:1;transform:none;pointer-events:auto}#top:hover{border-radius:50%}#top:active{transform:scale(.88)}
.rv{opacity:0;transform:translateY(34px) scale(.98);transition:opacity .7s var(--ease),transform .8s var(--spring);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

@media(max-width:980px){

  });
