<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="140" y1="100" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#52CBFF"/>
      <stop offset="0.48" stop-color="#0A7DE0"/>
      <stop offset="1" stop-color="#6B50D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#DDEBFF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="84" width="824" height="824" rx="196"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="gshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- soft ground shadow -->
  <rect x="140" y="150" width="744" height="800" rx="196" fill="#0B2A6B" opacity="0.38" filter="url(#shadow)"/>
  <rect x="116" y="112" width="792" height="810" rx="196" fill="#0B2A6B" opacity="0.18" filter="url(#shadow)"/>
  <!-- tile -->
  <rect x="100" y="84" width="824" height="824" rx="196" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="84" width="824" height="824" fill="url(#glow)"/>
    <!-- translucent back layer: sound rings -->
    <circle cx="700" cy="760" r="470" fill="url(#wave)"/>
    <circle cx="700" cy="760" r="340" fill="#fff" opacity="0.07"/>
    <circle cx="700" cy="760" r="215" fill="#fff" opacity="0.08"/>
  </g>
  <!-- glyph shadow -->
  <g id="note-shadow" fill="#0A2C8A" opacity="0.4" filter="url(#gshadow)" transform="translate(0 26)">
    <ellipse cx="392" cy="690" rx="82" ry="62" transform="rotate(-22 392 690)"/>
    <ellipse cx="652" cy="628" rx="82" ry="62" transform="rotate(-22 652 628)"/>
    <rect x="440" y="340" width="44" height="350" rx="8"/>
    <rect x="700" y="290" width="44" height="338" rx="8"/>
    <path d="M440 318 L744 250 V368 L440 436 Z"/>
  </g>
  <!-- glass note -->
  <g id="note" fill="url(#glass)">
    <ellipse cx="392" cy="690" rx="82" ry="62" transform="rotate(-22 392 690)"/>
    <ellipse cx="652" cy="628" rx="82" ry="62" transform="rotate(-22 652 628)"/>
    <rect x="440" y="340" width="44" height="350" rx="8"/>
    <rect x="700" y="290" width="44" height="338" rx="8"/>
    <path d="M440 318 L744 250 V368 L440 436 Z"/>
  </g>
  <!-- glass edge highlight on beam -->
  <path d="M440 318 L744 250" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- inner light stroke + top rim -->
  <rect x="101.500" y="85.500" width="821" height="821" rx="194.500" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
