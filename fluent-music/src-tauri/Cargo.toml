[package]
name = "fluent-music"
version = "2.0.0"
description = "Fluent Music - Fluent Design music player for Windows"
authors = ["minhtrong67"]
edition = "2021"

[lib]
name = "fluent_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
rayon = "1"
notify = "6"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Windows 11 backdrop materials (Mica / Acrylic / Mica Alt); same versions tauri uses internally
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows-version = "0.1"
