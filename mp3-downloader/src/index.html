<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MP3 Downloader</title>
  <link rel="icon" href="app-icon.png" type="image/png" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-app-window" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/> <path d="M10 4v4"/> <path d="M2 8h20"/> <path d="M6 4v4"/></symbol>

    <symbol id="i-film" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/> <path d="M7 3v18"/> <path d="M3 7.5h4"/> <path d="M3 12h18"/> <path d="M3 16.5h4"/> <path d="M17 3v18"/> <path d="M17 7.5h4"/> <path d="M17 16.5h4"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-folder-pen" viewBox="0 0 24 24"><path d="M2 11.5V5a2 2 0 0 1 2-2h3.9c.7 0 1.3.3 1.7.9l.8 1.2c.4.6 1 .9 1.7.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-9.5"/> <path d="M11.378 13.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></symbol>

    <symbol id="i-languages" viewBox="0 0 24 24"><path d="m5 8 6 6"/> <path d="m4 14 6-6 2-3"/> <path d="M2 5h12"/> <path d="M7 2h1"/> <path d="m22 22-5-10-5 10"/> <path d="M14 18h6"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/> <path d="M21 8V5a2 2 0 0 0-2-2h-3"/> <path d="M3 16v3a2 2 0 0 0 2 2h3"/> <path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/> <line x1="8" x2="16" y1="21" y2="21"/> <line x1="12" x2="12" y1="17" y2="21"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol>
    <symbol id="i-move-diagonal-2" viewBox="0 0 24 24"><path d="M19 13v6h-6"/> <path d="M5 11V5h6"/> <path d="m5 5 14 14"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/> <circle cx="6" cy="18" r="3"/> <circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/> <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/> <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/> <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/> <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
    <symbol id="i-panel-top" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/> <path d="M3 9h18"/></symbol>
    <symbol id="i-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/> <path d="M3 3v5h5"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18"/> <path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/> <path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/> <path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/> <path d="M7 21h10"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/> <circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/> <path d="M20 2v4"/> <path d="M22 4h-4"/> <circle cx="4" cy="20" r="2"/></symbol>
    <symbol id="i-square-arrow-out-up-right" viewBox="0 0 24 24"><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/> <path d="m21 3-9 9"/> <path d="M15 3h6v6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/> <path d="M12 2v2"/> <path d="M12 20v2"/> <path d="m4.93 4.93 1.41 1.41"/> <path d="m17.66 17.66 1.41 1.41"/> <path d="M2 12h2"/> <path d="M20 12h2"/> <path d="m6.34 17.66-1.41 1.41"/> <path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-sun-moon" viewBox="0 0 24 24"><path d="M12 2v2"/> <path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/> <path d="M16 12a4 4 0 0 0-4-4"/> <path d="m19 5-1.256 1.256"/> <path d="M20 12h2"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M12 19h8"/> <path d="m4 17 6-6-6-6"/></symbol>
    <symbol id="i-trash-2" viewBox="0 0 24 24"><path d="M10 11v6"/> <path d="M14 11v6"/> <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/> <path d="M3 6h18"/> <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M12 4v16"/> <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/> <path d="M9 20h6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/> <circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></symbol>
  </svg>

  <div class="app">
    <nav class="rail" aria-label="Navigation">
      <div class="rail-group">
        <button class="rail-item active" data-page="download" aria-current="page">
          <span class="rail-indicator"><svg class="icon"><use href="#i-download"/></svg></span>
          <span class="rail-label" data-i18n="nav.download"></span>
        </button>
        <button class="rail-item" data-page="settings">
          <span class="rail-indicator"><svg class="icon"><use href="#i-settings"/></svg></span>
          <span class="rail-label" data-i18n="nav.settings"></span>
        </button>
      </div>
      <div class="rail-group">
        <button class="rail-item" id="about-btn" aria-haspopup="dialog">
          <span class="rail-indicator"><svg class="icon"><use href="#i-info"/></svg></span>
          <span class="rail-label" data-i18n="nav.about"></span>
        </button>
      </div>
    </nav>

    <main class="main" id="main">
      <!-- ───────── Download page ───────── -->
      <section class="page active" id="page-download">
        <header class="page-head">
          <h1 data-i18n="dl.title"></h1>
          <p class="body-medium muted" data-i18n="dl.subtitle"></p>
        </header>

        <div class="banner" id="tools-banner" hidden>
          <span class="banner-icon"><svg class="icon"><use href="#i-wrench"/></svg></span>
          <div class="banner-text">
            <strong id="banner-title"></strong>
            <span id="banner-desc"></span>
          </div>
          <div class="banner-actions">
            <button class="btn text" id="banner-dismiss" hidden><svg class="icon"><use href="#i-x"/></svg><span data-i18n="ban.later"></span></button>
            <button class="btn text" id="banner-install"><svg class="icon"><use href="#i-cloud-download"/></svg><span id="banner-install-label"></span></button>
          </div>
          <div class="progress banner-progress" id="banner-progress" hidden><span></span></div>
        </div>

        <div class="field">
          <input id="url-input" type="text" placeholder=" " autocomplete="off" spellcheck="false" />
          <label for="url-input" data-i18n="dl.input"></label>
          <button class="icon-btn field-trailing" id="paste-btn" data-i18n-title="dl.paste" type="button">
            <svg class="icon"><use href="#i-clipboard-paste"/></svg>
          </button>
        </div>

        <div class="preview" id="preview" hidden></div>

        <div class="controls">
          <div class="chips" id="quality-chips" role="radiogroup" data-i18n-aria="dl.quality"></div>
          <button class="btn filled" id="download-btn" disabled type="button">
            <svg class="icon"><use href="#i-download"/></svg><span data-i18n="dl.button"></span>
          </button>
        </div>

        <div class="queue-head">
          <h2 data-i18n="dl.queue"></h2>
          <button class="btn text" id="clear-done" hidden type="button"><svg class="icon"><use href="#i-trash-2"/></svg><span data-i18n="dl.clearDone"></span></button>
        </div>
        <div class="queue" id="queue">
          <div class="empty" id="queue-empty">
            <span class="empty-icon"><svg class="icon"><use href="#i-music"/></svg></span>
            <p class="body-medium muted" data-i18n="dl.empty"></p>
          </div>
        </div>
      </section>

      <!-- ───────── Settings page ───────── -->
      <section class="page" id="page-settings">
        <header class="page-head">
          <h1 data-i18n="set.title"></h1>
          <p class="body-medium muted" data-i18n="set.subtitle"></p>
        </header>

        <!-- Appearance -->
        <section class="group">
          <h2 class="group-title"><svg class="icon"><use href="#i-palette"/></svg><span data-i18n="set.appearance"></span></h2>
          <div class="card">
            <div class="row wrap">
              <span class="lead"><svg class="icon"><use href="#i-sun-moon"/></svg></span>
              <div class="grow">
                <div class="title-medium" data-i18n="set.mode"></div>
                <div class="body-small muted" data-i18n="set.modeDesc"></div>
              </div>
              <div class="seg" id="mode-seg" role="radiogroup" data-i18n-aria="set.mode"></div>
            </div>

            <div class="row col">
              <div class="row-head">
                <span class="lead"><svg class="icon"><use href="#i-palette"/></svg></span>
                <div class="grow">
                  <div class="title-medium" data-i18n="set.color"></div>
                  <div class="body-small muted" data-i18n="set.colorDesc"></div>
                </div>
              </div>
              <div class="swatches" id="swatches" role="radiogroup" data-i18n-aria="set.color"></div>
              <div class="field small">
                <input id="hex-input" type="text" placeholder=" " maxlength="7" spellcheck="false" autocomplete="off" />
                <label for="hex-input" data-i18n="set.hex"></label>
              </div>
            </div>

            <div class="row col">
              <div class="row-head">
                <span class="lead"><svg class="icon"><use href="#i-type"/></svg></span>
                <div class="grow">
                  <div class="title-medium" data-i18n="set.font"></div>
                  <div class="body-small muted" data-i18n="set.fontDesc"></div>
                </div>
              </div>
              <div class="chips" id="font-chips" role="radiogroup" data-i18n-aria="set.font"></div>
            </div>

            <div class="row wrap">
              <span class="lead"><svg class="icon"><use href="#i-languages"/></svg></span>
              <div class="grow">
                <div class="title-medium" data-i18n="set.lang"></div>
                <div class="body-small muted" data-i18n="set.langDesc"></div>
              </div>
              <div class="seg" id="lang-seg" role="radiogroup" data-i18n-aria="set.lang"></div>
            </div>
          </div>
        </section>

        <!-- Downloads -->
        <section class="group">
          <h2 class="group-title"><svg class="icon"><use href="#i-download"/></svg><span data-i18n="set.downloads"></span></h2>
          <div class="card">
            <div class="row col">
              <div class="row-head">
                <span class="lead"><svg class="icon"><use href="#i-audio-waveform"/></svg></span>
                <div class="grow">
                  <div class="title-medium" data-i18n="set.quality"></div>
                  <div class="body-small muted" data-i18n="set.qualityDesc"></div>
                </div>
              </div>
              <div class="chips" id="default-quality-chips" role="radiogroup" data-i18n-aria="set.quality"></div>
            </div>

            <div class="row wrap">
              <span class="lead"><svg class="icon"><use href="#i-folder-open"/></svg></span>
              <div class="grow">
                <div class="title-medium" data-i18n="set.folder"></div>
                <div class="body-small muted path" id="out-dir"></div>
              </div>
              <div class="row-actions">
                <button class="btn tonal" id="pick-dir" type="button"><svg class="icon"><use href="#i-folder-pen"/></svg><span data-i18n="set.change"></span></button>
                <button class="btn text" id="open-dir" type="button"><svg class="icon"><use href="#i-square-arrow-out-up-right"/></svg><span data-i18n="set.open"></span></button>
              </div>
            </div>

            <label class="row switch-row">
              <span class="lead"><svg class="icon"><use href="#i-crop"/></svg></span>
              <div class="grow">
                <div class="title-medium" data-i18n="set.crop"></div>
                <div class="body-small muted" data-i18n="set.cropDesc"></div>
              </div>
              <input type="checkbox" class="switch" id="crop-switch" />
            </label>
          </div>
        </section>

        <!-- Window -->
        <section class="group">
          <h2 class="group-title"><svg class="icon"><use href="#i-app-window"/></svg><span data-i18n="set.window"></span></h2>
          <div class="card">
            <div class="row col">
              <div class="row-head">
                <span class="lead"><svg class="icon"><use href="#i-panel-top"/></svg></span>
                <div class="grow">
                  <div class="title-medium" data-i18n="set.startup"></div>
                  <div class="body-small muted" data-i18n="set.startupDesc"></div>
                </div>
              </div>
              <div class="opts" id="window-opts" role="radiogroup" data-i18n-aria="set.startup"></div>
            </div>
          </div>
        </section>

        <!-- Tools -->
        <section class="group">
          <h2 class="group-title"><svg class="icon"><use href="#i-wrench"/></svg><span data-i18n="set.tools"></span></h2>
          <div class="card">
            <div class="row hint-row"><p class="body-small muted" data-i18n="set.toolsDesc"></p></div>

            <div class="row wrap tool" data-tool="ytdlp">
              <span class="lead"><svg class="icon"><use href="#i-cloud-download"/></svg></span>
              <div class="grow">
                <div class="title-medium">yt-dlp</div>
                <div class="body-small muted tool-status"></div>
              </div>
              <button class="btn tonal tool-btn" type="button"><svg class="icon"><use href="#i-download"/></svg><span></span></button>
              <div class="progress tool-progress" hidden><span></span></div>
            </div>

            <div class="row wrap tool" data-tool="ffmpeg">
              <span class="lead"><svg class="icon"><use href="#i-film"/></svg></span>
              <div class="grow">
                <div class="title-medium">ffmpeg</div>
                <div class="body-small muted tool-status"></div>
              </div>
              <button class="btn tonal tool-btn" type="button"><svg class="icon"><use href="#i-download"/></svg><span></span></button>
              <div class="progress tool-progress" hidden><span></span></div>
            </div>

            <div class="row wrap tool" data-tool="deno">
              <span class="lead"><svg class="icon"><use href="#i-terminal"/></svg></span>
              <div class="grow">
                <div class="title-medium">Deno <span class="tag opt-tag" data-i18n="tool.recommended"></span></div>
                <div class="body-small muted tool-status"></div>
              </div>
              <button class="btn tonal tool-btn" type="button"><svg class="icon"><use href="#i-download"/></svg><span></span></button>
              <div class="progress tool-progress" hidden><span></span></div>
            </div>
          </div>
        </section>

        <p class="body-small muted footnote" data-i18n="set.footnote"></p>
      </section>
    </main>
  </div>

  <!-- About dialog -->
  <div class="scrim" id="about-scrim" hidden>
    <div class="dialog" id="about-dialog" role="dialog" aria-modal="true" aria-labelledby="about-title" tabindex="-1">
      <img class="dialog-icon" src="app-icon.png" width="72" height="72" alt="" />
      <h2 id="about-title">MP3 Downloader</h2>
      <p class="body-medium muted" id="about-version"></p>
      <p class="body-medium about-desc" data-i18n="about.desc"></p>
      <div class="about-people">
        <div class="person">
          <span class="body-small muted" data-i18n="about.author"></span>
          <span class="hl hl-primary"><svg class="icon"><use href="#i-user"/></svg>minhtrong67</span>
        </div>
        <div class="person">
          <span class="body-small muted" data-i18n="about.ai"></span>
          <span class="hl hl-tertiary"><svg class="icon"><use href="#i-sparkles"/></svg>Claude</span>
        </div>
      </div>
      <p class="about-meta body-small muted"><svg class="icon"><use href="#i-scale"/></svg><span data-i18n="about.license"></span></p>
      <div class="dialog-actions">
        <button class="btn tonal" id="about-close" type="button"><svg class="icon"><use href="#i-x"/></svg><span data-i18n="about.close"></span></button>
      </div>
    </div>
  </div>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite">
    <span id="snack-text"></span>
    <button class="btn text" id="snack-action" hidden type="button"></button>
  </div>

  <script src="vendor/mcu.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
