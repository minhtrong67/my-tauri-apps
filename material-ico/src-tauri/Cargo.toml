[package]
name = "material-ico"
version = "1.0.0"
description = "Simple Icon File Maker - create .ico files from images and SVGs"
authors = ["minhtrong67"]
edition = "2021"
license = "MIT"
repository = "https://github.com/minhtrong67/my-tauri-apps"

[lib]
name = "material_ico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

# NOTE: [profile.*] lives in the workspace Cargo.toml one level up.
