[package]
name = "fluent-json"
version = "2.0.0"
description = "Fluent JSON - a full-featured JSON editor and toolbox built with Tauri and Microsoft Fluent Design"
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fluent_json_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reads the Windows accent colour from the registry.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
