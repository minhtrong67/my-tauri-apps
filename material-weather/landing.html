const PRESETS=['#0B57D0','#6750A4','#00796B','#2E7D32','#E65100','#C2185B','#BA1A1A','#546E7A'];

 else set({p:c(s,40),'on-p':'#fff',pc:c(Math.min(s+10,90),90),'on-pc':c(s,13),sc:c(28,89),'on-sc':c(30,14),s:c(40,98),'on-s':c(14,10),'on-sv':c(8,30),o:c(6,46),ov:c(14,80),c1:c(30,95),c2:c(26,92),c3:c(22,88)});
 document.documentElement.style.colorScheme=dark?'dark':'light';
 document.querySelectorAll('#pTheme button').forEach(b=>b.setAttribute('aria-checked',b.dataset.theme===mode));
 document.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-checked',b.dataset.c.toLowerCase()===seed.toLowerCase()))}
