[package]
name = "material-weather"
version = "1.2.0"
description = "A beautiful Material Design 3 weather desktop app built with Tauri 2."
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# NOTE: [profile.*] lives in the workspace root Cargo.toml (Cargo ignores it here).

[lib]
name = "material_weather_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "~2.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
