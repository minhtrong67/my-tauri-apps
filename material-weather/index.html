*{box-sizing:border-box;margin:0;padding:0}
 html{scroll-behavior:smooth;scroll-padding-top:96px;-webkit-text-size-adjust:100%}

img,svg,canvas{display:block;max-width:100%}img{height:auto}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

section{position:relative;padding:112px 0;scroll-margin-top:96px}

/* ---------- buttons (pill that morphs to a squircle on hover/press) ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 26px;border-radius:999px;font-weight:600;white-space:nowrap;transition:border-radius .3s var(--sp),transform .3s var(--sp),box-shadow .2s,background-color .2s}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;z-index:-1}.btn:hover::after{opacity:.09}
.btn:hover{border-radius:18px}.btn:active{transform:scale(.95);border-radius:14px}
.btn.lg{height:60px;padding:0 32px;font-size:1.05rem}
.filled{background:var(--p);color:var(--on-p)}.filled:hover{box-shadow:0 10px 28px color-mix(in srgb,var(--p) 42%,transparent)}
.tonal{background:var(--sc);color:var(--on-sc)}.outlined{border:1.5px solid var(--o);color:var(--p)}
.rw{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .65s cubic-bezier(0,0,0,1) forwards;pointer-events:none}@keyframes rip{to{transform:scale(1);opacity:0}}
/* ---------- header: floating expressive toolbar ---------- */
header.top{position:fixed;inset:14px 0 auto;z-index:60;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:6px;height:64px;padding:0 10px 0 14px;border-radius:32px;background:color-mix(in srgb,var(--c2) 94%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ov) 60%,transparent),0 8px 30px rgb(0 0 0/.08);transition:box-shadow .3s,background-color .3s}
header.top.scrolled .bar{box-shadow:0 0 0 1px color-mix(in srgb,var(--ov) 60%,transparent),0 14px 40px rgb(0 0 0/.16)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.12rem;letter-spacing:-.01em;white-space:nowrap}.brand img{width:40px;height:40px;border-radius:13px;transition:border-radius .3s var(--sp),transform .3s var(--sp)}.brand:hover img{border-radius:50%;transform:rotate(-8deg) scale(1.06)}
.links{position:relative;display:flex;margin-left:18px;gap:2px}
.links a{position:relative;z-index:1;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--on-sv);transition:color .25s}.links a:hover{color:var(--on-s)}.links a.on{color:var(--on-sc)}
.pill{position:absolute;z-index:0;top:0;bottom:0;left:0;width:0;border-radius:999px;background:var(--sc);transition:transform .55s var(--sp),width .55s var(--sp),opacity .3s;opacity:0}
.tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.ib{position:relative;overflow:hidden;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--on-sv);transition:background-color .15s,border-radius .3s var(--sp),color .15s,transform .3s var(--sp)}.ib:hover{background:var(--c4);color:var(--on-s);border-radius:16px}.ib:active{transform:scale(.9)}.ib[aria-expanded=true]{background:var(--pc);color:var(--on-pc);border-radius:16px}
.pw{position:relative}
.pop{position:absolute;top:calc(100% + 14px);right:0;min-width:210px;background:var(--c3);border-radius:28px;padding:8px;box-shadow:0 18px 50px rgb(0 0 0/.28);opacity:0;visibility:hidden;transform:translateY(-10px) scale(.92);transform-origin:top right;transition:transform .3s var(--sp),opacity .15s,visibility .15s}
.pop.open{opacity:1;visibility:visible;transform:none}
.pop>button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:18px;text-align:left;font-weight:500;transition:background-color .2s}.pop>button:hover{background:var(--c4)}.pop>button[aria-checked=true]{background:var(--pc);color:var(--on-pc);font-weight:700}
.pop h4{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--on-sv);padding:8px 12px 6px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 10px 12px;min-width:236px}
.sw button,.sw label{position:relative;aspect-ratio:1;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;transition:transform .45s var(--sp),border-radius .45s var(--sp)}
.sw button:hover,.sw label:hover{transform:scale(1.14)}.sw button svg{opacity:0;transition:opacity .2s}
.sw button[aria-checked=true]{border-radius:34%;box-shadow:0 0 0 3px var(--c3),0 0 0 5px var(--p)}.sw button[aria-checked=true] svg{opacity:1}
.sw label{background:conic-gradient(#f44336,#ff9800,#ffeb3b,#4caf50,#00bcd4,#2196f3,#9c27b0,#f44336);overflow:hidden;cursor:pointer}.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.menu{display:none}
.hcta{height:44px;padding:0 20px;margin-right:6px}
/* ---------- hero ---------- */
.hero{padding:150px 0 100px;overflow:hidden}
.blob{position:absolute;z-index:-1;pointer-events:none;opacity:.5}
.b1{width:520px;height:520px;background:var(--pc);top:-160px;right:-140px;clip-path:var(--cookie);animation-name:spin,drift}

.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}

.marq{padding:26px 0;overflow:hidden;background:var(--c1);border-block:1px solid var(--ov);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq div{display:flex;gap:14px;width:max-content;animation:mq 38s linear infinite;will-change:transform}.marq:hover div{animation-play-state:paused}
.marq span{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;background:var(--c3);font-weight:700;color:var(--on-sv)}.marq span:nth-child(3n+1){background:var(--pc);color:var(--on-pc)}.marq span:nth-child(3n+2){background:var(--tc);color:var(--on-tc)}
@keyframes mq{to{transform:translateX(-50%)}}
/* ---------- section heads ---------- */
.head{max-width:760px;margin-bottom:56px}.head.center{margin-inline:auto;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--p)}.eyebrow::before{content:"";width:14px;height:14px;background:var(--p);clip-path:var(--flower)}
h2{font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:12px 0 14px}.sub{font-size:1.1rem;color:var(--on-sv)}
.alt{background:var(--c1)}
/* ---------- bento features ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{--mx:50%;--my:50%;position:relative;overflow:hidden;grid-column:span 4;padding:28px;border-radius:32px;background:var(--c2);transition:transform .3s var(--sp),background-color .2s;contain:paint}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx) var(--my),color-mix(in srgb,var(--p) 16%,transparent),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{transform:translateY(-5px)}.card:hover::before{opacity:1}
.card.w6{grid-column:span 6}.card.w8{grid-column:span 8}.card.tint{background:var(--pc);color:var(--on-pc)}.card.tint p{color:inherit;opacity:.85}.card.tint2{background:var(--tc);color:var(--on-tc)}.card.tint2 p{color:inherit;opacity:.85}
.ico{width:58px;height:58px;display:grid;place-items:center;margin-bottom:18px;background:var(--p);color:var(--on-p);clip-path:var(--cookie);transition:rotate .3s var(--sp)}.card:nth-child(3n+2) .ico{clip-path:var(--flower);background:var(--sc);color:var(--on-sc)}.card:nth-child(3n) .ico{clip-path:var(--burst);background:var(--tc);color:var(--on-tc)}.card:hover .ico{rotate:90deg}
.card h3{font-size:1.28rem;letter-spacing:-.01em;margin-bottom:6px}.card p{color:var(--on-sv)}
/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.stat{padding:30px 24px;border-radius:32px;background:var(--sc);color:var(--on-sc);text-align:center;transition:border-radius .35s var(--sp)}.stat:nth-child(even){background:var(--tc);color:var(--on-tc);border-radius:44px 24px 44px 24px}.stat:hover{border-radius:24px 44px 24px 44px}
.stat b{display:block;font-size:3.4rem;line-height:1;letter-spacing:-.04em;font-weight:800}.stat span{font-weight:600;opacity:.85}
/* ---------- screenshots ---------- */
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:28px}
.tabs button{height:44px;padding:0 22px;border-radius:999px;background:var(--c3);font-weight:700;color:var(--on-sv);position:relative;overflow:hidden;transition:border-radius .3s var(--sp),background-color .25s,color .25s,transform .3s var(--sp)}.tabs button:hover{border-radius:15px}.tabs button[aria-selected=true]{background:var(--p);color:var(--on-p);border-radius:15px}.tabs button:active{transform:scale(.94)}
.shotwrap{position:relative;max-width:1000px;margin-inline:auto}
.win{border-radius:32px;overflow:hidden;background:var(--c3);box-shadow:0 40px 90px rgb(0 0 0/.22),0 0 0 1px var(--ov);cursor:zoom-in;transition:transform .3s var(--sp)}.win:hover{transform:scale(1.01)}
.win .bar2{display:flex;align-items:center;gap:7px;padding:13px 18px;background:var(--c4);font-size:.82rem;font-weight:700;color:var(--on-sv)}.win .bar2 i{width:12px;height:12px;border-radius:50%;background:var(--o);opacity:.5}
.win img{width:100%;aspect-ratio:1280/800;object-fit:cover;transition:opacity .2s,transform .3s var(--sf)}.win img.fade{opacity:0;transform:scale(.985)}
.cap{text-align:center;color:var(--on-sv);margin-top:20px;min-height:1.6em}
.lb{position:fixed;inset:0;z-index:120;background:rgb(0 0 0/.82);display:grid;place-items:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;cursor:zoom-out}.lb.open{opacity:1;visibility:visible}.lb img{max-height:92vh;border-radius:24px;transform:scale(.9);transition:transform .55s var(--sp)}.lb.open img{transform:none}
.lb .ib{position:absolute;top:18px;right:18px;color:#fff;background:rgb(255 255 255/.16)}
.prog{height:4px;width:min(240px,60%);margin:-8px auto 26px;border-radius:4px;background:var(--c4);overflow:hidden}.prog i{display:block;height:100%;width:100%;background:var(--p);border-radius:4px;transform-origin:left;transform:scaleX(0)}
.prog.run i{animation:fill var(--dur,6s) linear forwards}@keyframes fill{to{transform:scaleX(1)}}
.shotwrap .nav{position:absolute;top:50%;z-index:5;width:52px;height:52px;margin-top:-26px;background:var(--c1);box-shadow:0 8px 24px rgb(0 0 0/.2);opacity:0;transition:opacity .25s,background-color .2s,border-radius .3s var(--sp)}
.shotwrap:hover .nav,.shotwrap:focus-within .nav{opacity:1}.nav.prev{left:-26px}.nav.next{right:-26px}
.win img{touch-action:pan-y}
@media(hover:none){.shotwrap .nav{display:none}}
/* ---------- theme lab ---------- */
.lab{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:26px 0 22px;max-width:440px}
.palette button{position:relative;aspect-ratio:1;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;transition:transform .3s var(--sp),border-radius .3s var(--sp)}.palette button:hover{transform:scale(1.15) rotate(8deg)}.palette button svg{opacity:0;transform:scale(.4);transition:all .4s var(--sp)}.palette button[aria-checked=true]{border-radius:32%;box-shadow:0 0 0 3px var(--c1),0 0 0 5px var(--p)}.palette button[aria-checked=true] svg{opacity:1;transform:none}
.seg{display:inline-flex;gap:3px;flex-wrap:wrap}.seg button{height:44px;padding:0 20px;font-weight:700;background:var(--c4);color:var(--on-s);border-radius:6px;transition:border-radius .3s var(--sp),background-color .25s,color .25s}.seg button:first-child{border-radius:999px 6px 6px 999px}.seg button:last-child{border-radius:6px 999px 999px 6px}.seg button[aria-checked=true]{background:var(--p);color:var(--on-p);border-radius:999px}
.lbl{display:block;font-weight:700;font-size:.85rem;color:var(--on-sv);margin:18px 0 8px}
.mock{background:var(--c0);border-radius:40px;padding:26px;box-shadow:0 30px 70px rgb(0 0 0/.14),0 0 0 1px var(--ov);display:grid;gap:18px;transition:background-color .4s}
.mock .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mock .card2{border-radius:28px;padding:20px;background:var(--pc);color:var(--on-pc);display:flex;align-items:center;gap:16px}.mock .card2 .ico{margin:0;width:54px;height:54px}.mock .card2 b{font-size:1.25rem;display:block}
.mock .tile{flex:1;min-width:120px;border-radius:24px;padding:16px;background:var(--c3)}.mock .tile:nth-child(2){background:var(--sc);color:var(--on-sc)}.mock .tile:nth-child(3){background:var(--tc);color:var(--on-tc)}.mock .tile b{font-size:1.7rem;display:block;line-height:1.1}
.sw2{width:56px;height:34px;border-radius:99px;background:var(--p);position:relative;transition:background-color .3s}.sw2::after{content:"";position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:var(--on-p);animation:tog 3.2s var(--sp) infinite}@keyframes tog{0%,35%{transform:none}50%,85%{transform:translateX(-22px)}}
.slider{flex:1;min-width:140px;height:18px;border-radius:99px;background:var(--c4);position:relative}.slider i{position:absolute;inset:0 38% 0 0;background:var(--p);border-radius:99px 6px 6px 99px}.slider b{position:absolute;left:62%;top:-6px;width:6px;height:30px;border-radius:3px;background:var(--p)}
.fab{width:60px;height:60px;border-radius:20px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;box-shadow:0 6px 16px rgb(0 0 0/.18);transition:border-radius .3s var(--sp)}.fab:hover{border-radius:50%}
.wave{height:12px;width:100%;overflow:hidden;border-radius:6px}.wave svg{width:1200px;height:12px;animation:wv 1s linear infinite}@keyframes wv{to{transform:translateX(-30px)}}
/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
.step{position:relative;padding:34px 28px;border-radius:36px;background:var(--c2);counter-increment:s}.step::before{content:counter(s);display:grid;place-items:center;width:64px;height:64px;font-size:1.8rem;font-weight:800;background:var(--p);color:var(--on-p);clip-path:var(--cookie);margin-bottom:18px}.step:nth-child(2)::before{clip-path:var(--flower);background:var(--sc);color:var(--on-sc)}.step:nth-child(3)::before{clip-path:var(--burst);background:var(--tc);color:var(--on-tc)}.step h3{font-size:1.2rem}.step p{color:var(--on-sv)}
/* ---------- download ---------- */
.dl{position:relative;overflow:hidden;border-radius:56px;padding:76px 28px;text-align:center;background:var(--pc);color:var(--on-pc);isolation:isolate}
.dl::before,.dl::after{content:"";position:absolute;z-index:-1;background:color-mix(in srgb,var(--p) 18%,transparent)}.dl::before{width:420px;height:420px;left:-120px;top:-140px;clip-path:var(--flower)}.dl::after{width:340px;height:340px;right:-90px;bottom:-120px;clip-path:var(--cookie)}
.dl h2{margin-top:0}.dl .sub{color:inherit;opacity:.85;max-width:38rem;margin:0 auto 32px}.dl .btn.filled{box-shadow:0 14px 34px color-mix(in srgb,var(--p) 35%,transparent)}
.new{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:760px;margin:36px auto 0}.new li{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:color-mix(in srgb,var(--p) 14%,transparent);font-size:.88rem;font-weight:700}.new li svg{width:1em;height:1em}
.dl .note{margin:20px auto 0;font-size:.92rem;opacity:.85;max-width:40rem}.dl .ver{display:inline-flex;gap:8px;margin-bottom:22px}.dl .ver span{padding:6px 14px;border-radius:999px;background:var(--on-pc);color:var(--pc);font-size:.82rem;font-weight:700}
/* ---------- faq ---------- */
.faq{display:grid;gap:10px;max-width:820px;margin-inline:auto}
.q{border-radius:28px;background:var(--c2);overflow:hidden;transition:border-radius .3s var(--sp),background-color .3s}.q.open{border-radius:36px;background:var(--c3)}
.q button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;text-align:left;font-weight:700;font-size:1.05rem}.q button svg{transition:transform .3s var(--sp)}.q.open button svg{transform:rotate(180deg)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--sf)}.q.open .a{grid-template-rows:1fr}.q .a>div{overflow:hidden}.q .a p{padding:0 26px 24px;color:var(--on-sv)}
/* ---------- footer + fab ---------- */
footer{padding:56px 0 44px;background:var(--c1);border-top:1px solid var(--ov)}
.foot{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}.foot p{color:var(--on-sv);font-size:.92rem}.foot a{text-decoration:underline;text-underline-offset:3px}
.cred{display:inline-flex;align-items:center;gap:8px;font-weight:800}.cred b{padding:3px 12px;border-radius:999px;background:var(--pc);color:var(--on-pc)}.cred b+span+b{background:linear-gradient(90deg,#d97757,#c15f3c);color:#fff}
.top-fab{position:fixed;right:22px;bottom:22px;z-index:70;width:60px;height:60px;border-radius:22px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;box-shadow:0 12px 34px rgb(0 0 0/.28);transform:translateY(120px) scale(.6);opacity:0;pointer-events:none;transition:transform .35s var(--sp),opacity .25s,border-radius .3s var(--sp)}
.top-fab.show{transform:none;opacity:1;pointer-events:auto}.top-fab:hover{border-radius:50%}.top-fab:active{transform:scale(.9)}
.top-fab svg.ring{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg;overflow:visible}.top-fab circle{fill:none;stroke:var(--p);stroke-width:3;stroke-linecap:round}
.top-fab .i{position:relative;transition:transform .4s var(--sp)}.top-fab:hover .i{transform:translateY(-3px)}
/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .45s var(--sf) var(--d,0ms),transform .55s var(--sp) var(--d,0ms)}.reveal.in{opacity:1;transform:none}
/* ---------- responsive ---------- */
@media(max-width:1020px){.hero-grid,.lab{grid-template-columns:1fr}.stage{max-width:520px;margin-inline:auto}.demo{transform:none}.f1{left:auto;right:12px}.f2{right:-6px}.card,.card.w6,.card.w8{grid-column:span 6}.stats{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}
 .links{display:none;position:absolute;left:0;right:0;top:calc(100% + 10px);flex-direction:column;margin:0;padding:10px;border-radius:32px;background:var(--c3);box-shadow:0 20px 60px rgb(0 0 0/.3)}.links a{padding:14px 18px}.pill{display:none}.links a.on{background:var(--pc);color:var(--on-pc)}.nav-open .links{display:flex;animation:pop .3s var(--sp)}@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.94)}}.menu{display:grid}.bar{position:relative}}
@media(max-width:640px){.hcta span{display:none}.hcta{width:44px;padding:0}.shotwrap .nav{display:none}section{padding:78px 0}.hero{padding:118px 0 70px}.card,.card.w6,.card.w8{grid-column:span 12}.demo{min-height:390px;padding:24px}.demo .t{font-size:5.6rem}.demo .badge{width:120px;height:120px}.demo .badge svg{width:64px;height:64px}.palette{grid-template-columns:repeat(4,1fr)}.dl{padding:56px 20px;border-radius:40px}.brand span{display:none}.float{display:none}.btn.lg{width:100%}.stat b{font-size:2.6rem}.mock{padding:18px;border-radius:32px}.top-fab{right:14px;bottom:14px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
</style>
</head>

 {k:'cloud',ic:'cloud',g:['#5d7a99','#9db6cc'],t:27,en:'Cloudy',vi:'Nhiều mây',fx:'cloud',p:['High 28°','Wind 14 km/h','Humidity 66%'],pv:['Cao 28°','Gió 14 km/h','Độ ẩm 66%']},
 {k:'rain',ic:'rain',g:['#36485c','#6a8299'],t:24,en:'Rain',vi:'Có mưa',fx:'rain',p:['Rain 80%','Wind 18 km/h','Humidity 88%'],pv:['Mưa 80%','Gió 18 km/h','Độ ẩm 88%']},

 $('#demoIcon').innerHTML=IC[s.ic];$('#demoC').textContent=vi()?s.vi:s.en;[1,2,3].forEach((n,k)=>$('#p'+n).textContent=(vi()?s.pv:s.p)[k]);
 $$('#scenes button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));fx.set(s.fx);
 const el=$('#demoT'),from=shown,to=s.t;shown=to;if(!anim||reduce){el.textContent=to;return}let t0;const step=t=>{t0??=t;const k=Math.min((t-t0)/700,1);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

const SPR=(()=>{const s=document.createElement('canvas');s.width=s.height=96;const g=s.getContext('2d'),r=g.createRadialGradient(48,48,0,48,48,48);r.addColorStop(0,'#fff');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,96,96);return s})();
const fx=(()=>{const c=$('#fx'),x=c.getContext('2d');let w=0,h=0,kind='sun',P=[],raf=0,run=false,flash=0,next=0,last=0;
 const rnd=(a,b)=>a+Math.random()*(b-a);

   if(p.cloud){p.x+=p.v*dt;if(p.x>w+120)p.x=-160;const r=70*p.s;x.globalAlpha=.22;x.drawImage(SPR,p.x-r,p.y-r,r*2,r*2);x.globalAlpha=1;continue}

   else if(kind==='snow'){p.y+=(30+p.r*14)*dt;p.x+=Math.sin(t+p.ph)*20*dt;if(p.y>h+5){p.y=-5;p.x=rnd(0,w)}x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
