  <div id="app">
    <div class="progress" id="progress" hidden></div>

    <!-- tab bar (app icon + folder tabs) -->
    <div class="tabbar">
      <img class="app-logo" src="assets/logo.svg" alt="Material File" width="26" height="26">
      <div class="ftabs" id="ftabs" role="tablist"></div>
      <button class="icon-btn small" id="btn-newtab" data-i18n-title="tab.new"><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>

    <!-- navigation row -->
    <header class="navbar">
      <div class="nav-btns">
        <button class="icon-btn" id="btn-back" data-i18n-title="nav.back"><svg class="icon"><use href="#i-back"/></svg></button>
        <button class="icon-btn" id="btn-forward" data-i18n-title="nav.forward"><svg class="icon"><use href="#i-forward"/></svg></button>
        <button class="icon-btn" id="btn-up" data-i18n-title="nav.up"><svg class="icon"><use href="#i-up"/></svg></button>
        <button class="icon-btn" id="btn-refresh" data-i18n-title="nav.refresh"><svg class="icon"><use href="#i-refresh"/></svg></button>
      </div>
      <div class="address" id="address">
        <div class="crumbs" id="crumbs"></div>
        <button class="icon-btn small addr-copy" id="addr-copy" data-i18n-title="cmd.copyPathBtn"><svg class="icon"><use href="#i-copy-path"/></svg></button>
        <input id="address-input" class="address-input" type="text" spellcheck="false" autocomplete="off" hidden data-i18n-placeholder="address.placeholder">
      </div>
      <div class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="search-input" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="search.placeholder">
        <button class="icon-btn small" id="search-clear" hidden><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="nav-actions">
        <button class="icon-btn" id="btn-theme" data-i18n-title="toolbar.theme"><svg class="icon"><use id="theme-use" href="#i-system"/></svg></button>
        <button class="icon-btn" id="btn-settings" data-i18n-title="toolbar.settings"><svg class="icon"><use href="#i-settings"/></svg></button>
        <button class="icon-btn" id="btn-about" data-i18n-title="toolbar.about"><svg class="icon"><use href="#i-info"/></svg></button>
      </div>
    </header>

    <!-- command bar -->
    <div class="cmdbar" id="cmdbar">
      <button class="cmd-btn" id="cmd-new"><svg class="icon"><use href="#i-plus"/></svg><span data-i18n="cmd.new"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <span class="cmd-sep"></span>
      <button class="icon-btn" id="cmd-cut" data-i18n-title="cmd.cut"><svg class="icon"><use href="#i-cut"/></svg></button>
      <button class="icon-btn" id="cmd-copy" data-i18n-title="cmd.copy"><svg class="icon"><use href="#i-copy"/></svg></button>
      <button class="icon-btn" id="cmd-paste" data-i18n-title="cmd.paste"><svg class="icon"><use href="#i-paste"/></svg></button>
      <button class="icon-btn" id="cmd-rename" data-i18n-title="cmd.rename"><svg class="icon"><use href="#i-rename"/></svg></button>
      <button class="icon-btn" id="cmd-delete" data-i18n-title="cmd.delete"><svg class="icon"><use href="#i-trash"/></svg></button>
      <span class="cmd-sep"></span>
      <button class="icon-btn" id="cmd-undo" data-i18n-title="cmd.undo"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button class="cmd-btn" id="cmd-extract" hidden><svg class="icon"><use href="#i-archive"/></svg><span data-i18n="cmd.extractAll"></span></button>
      <span class="cmd-sep"></span>
      <button class="cmd-btn" id="cmd-sort"><svg class="icon"><use href="#i-sort"/></svg><span data-i18n="cmd.sort"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <button class="cmd-btn" id="cmd-filter"><svg class="icon"><use href="#i-filter"/></svg><span data-i18n="cmd.filter"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <button class="cmd-btn" id="cmd-view"><svg class="icon"><use id="view-use" href="#i-list"/></svg><span data-i18n="cmd.view"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <button class="icon-btn" id="cmd-more" data-i18n-title="cmd.more"><svg class="icon"><use href="#i-more"/></svg></button>
      <span class="grow"></span>
      <button class="cmd-btn" id="cmd-props"><svg class="icon"><use href="#i-info"/></svg><span data-i18n="cmd.properties"></span></button>
    </div>

    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content">
        <div class="list" id="list" tabindex="0" role="listbox" aria-multiselectable="true"></div>
        <div class="empty" id="empty" hidden>
          <svg class="empty-ic"><use href="#f-folder"/></svg>
          <p id="empty-text"></p>
        </div>
      </main>
      <aside class="details-pane" id="details" hidden></aside>
    </div>

    <footer class="statusbar">
      <span id="st-items"></span>
      <span id="st-sel"></span>
      <span class="grow"></span>
      <button class="icon-btn small" id="st-pane" data-i18n-title="view.detailsPane"><svg class="icon"><use href="#i-panel-right"/></svg></button>
      <span class="st-sep"></span>
      <div class="st-views">
        <button class="icon-btn small" id="st-details" data-i18n-title="view.details"><svg class="icon"><use href="#i-list"/></svg></button>
        <button class="icon-btn small" id="st-grid" data-i18n-title="view.grid"><svg class="icon"><use href="#i-grid"/></svg></button>
      </div>
    </footer>
  </div>

  <div id="menu-pop" class="menu-pop" role="menu" hidden></div>
  <div id="menu-sub" class="menu-pop" role="menu" hidden></div>
  <div id="snackbar" class="snackbar" role="status"></div>

  <!-- file operation progress (copy / move) -->
  <div class="opcard" id="opcard" hidden>
    <div class="op-title" id="op-title"></div>
    <div class="op-name" id="op-name"></div>
    <div class="op-bar"><i id="op-fill"></i></div>
    <div class="op-row"><span id="op-pct"></span><button class="btn-text" id="op-cancel" data-i18n="common.cancel"></button></div>
  </div>

  <!-- Settings -->
  <dialog id="dlg-settings" class="dlg dlg-settings" aria-labelledby="st-title">
    <div class="st-shell" tabindex="-1">
      <nav class="st-nav" id="st-nav">
        <div class="st-brand"><svg class="icon"><use href="#i-settings"/></svg><h2 id="st-title" data-i18n="settings.title"></h2></div>
        <button class="st-tab active" data-panel="appearance"><svg class="icon"><use href="#i-palette"/></svg><span data-i18n="settings.appearance"></span></button>
        <button class="st-tab" data-panel="general"><svg class="icon"><use href="#i-sliders"/></svg><span data-i18n="settings.general"></span></button>
        <button class="st-tab" data-panel="files"><svg class="icon"><use href="#i-folder"/></svg><span data-i18n="settings.files"></span></button>
        <button class="st-tab" data-panel="about"><svg class="icon"><use href="#i-info"/></svg><span data-i18n="settings.about"></span></button>
        <span class="grow"></span>
        <div class="st-credit"><span data-i18n="about.author"></span> <b>minhtrong67</b><span class="st-credit-ai"><svg class="icon"><use href="#i-heart"/></svg>Claude</span></div>
      </nav>
      <div class="st-body">
        <header class="st-head">
          <div class="st-headtext"><h3 id="st-heading"></h3><p id="st-sub"></p></div>
          <button class="icon-btn" id="settings-close" data-i18n-title="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
        </header>
        <div class="st-panels" id="st-panels">

          <section class="st-panel" data-panel="appearance">
            <div class="st-card">
              <div class="st-row">
                <span class="st-ic"><svg class="icon"><use href="#i-sun"/></svg></span>
                <span class="st-text"><b data-i18n="settings.theme"></b><small data-i18n="settings.d.theme"></small></span>
                <div class="segmented" id="seg-theme"><label><input type="radio" name="theme" value="light"><span><svg class="icon"><use href="#i-sun"/></svg><b data-i18n="settings.light"></b></span></label><label><input type="radio" name="theme" value="dark"><span><svg class="icon"><use href="#i-moon"/></svg><b data-i18n="settings.dark"></b></span></label><label><input type="radio" name="theme" value="system"><span><svg class="icon"><use href="#i-system"/></svg><b data-i18n="settings.system"></b></span></label></div>
              </div>
            </div>

            <div class="st-label" data-i18n="settings.color"></div>
            <div class="st-card st-pad">
              <div class="st-note" data-i18n="settings.d.color"></div>
              <div class="swatches" id="swatches" role="radiogroup"></div>
              <div class="color-foot">
                <label class="custom-color"><input type="color" id="seed-input"><span class="st-text"><b data-i18n="settings.custom"></b><small id="seed-hex"></small></span></label>
                <div class="palette" aria-hidden="true"><i class="p1"></i><i class="p2"></i><i class="p3"></i><i class="p4"></i><i class="p5"></i></div>
              </div>
            </div>

            <div class="st-label" data-i18n="settings.font"></div>
            <div class="st-card st-pad">
              <div class="st-note" data-i18n="settings.d.font"></div>
              <div class="font-grid" id="font-grid" role="radiogroup"></div>
            </div>
          </section>

          <section class="st-panel" data-panel="general" hidden>
            <div class="st-card">
              <div class="st-row">
                <span class="st-ic"><svg class="icon"><use href="#i-languages"/></svg></span>
                <span class="st-text"><b data-i18n="settings.language"></b><small data-i18n="settings.d.language"></small></span>
                <div class="segmented" id="seg-lang"><label><input type="radio" name="lang" value="en"><span><b data-i18n="settings.langEn"></b></span></label><label><input type="radio" name="lang" value="vi"><span><b data-i18n="settings.langVi"></b></span></label></div>
              </div>
            </div>

            <div class="st-label" data-i18n="settings.windowOnStart"></div>
            <div class="st-card st-pad">
              <div class="st-note" data-i18n="settings.d.windowStart"></div>
              <div class="choice" id="seg-window">
                <label class="choice-item"><input type="radio" name="winmode" value="remember"><span class="ci"><svg class="icon"><use href="#i-resize"/></svg><span class="ct"><b data-i18n="settings.winRemember"></b><small data-i18n="settings.d.winRemember"></small></span><svg class="icon tick"><use href="#i-check"/></svg></span></label>
                <label class="choice-item"><input type="radio" name="winmode" value="maximized"><span class="ci"><svg class="icon"><use href="#i-maximize"/></svg><span class="ct"><b data-i18n="settings.winMax"></b><small data-i18n="settings.d.winMax"></small></span><svg class="icon tick"><use href="#i-check"/></svg></span></label>
              </div>
            </div>

            <div class="st-label" data-i18n="settings.maintenance"></div>
            <div class="st-card">
              <div class="st-row">
                <span class="st-ic"><svg class="icon"><use href="#i-reset"/></svg></span>
                <span class="st-text"><b data-i18n="settings.reset"></b><small data-i18n="settings.d.reset"></small></span>
                <button class="btn-tonal" id="btn-reset" data-i18n="settings.resetBtn"></button>
              </div>
            </div>
          </section>

          <section class="st-panel" data-panel="files" hidden>
            <div class="st-card">
              <div class="st-row">
                <span class="st-ic"><svg class="icon"><use href="#i-grid"/></svg></span>
                <span class="st-text"><b data-i18n="settings.defaultView"></b><small data-i18n="settings.d.view"></small></span>
                <div class="segmented" id="seg-view"><label><input type="radio" name="view" value="details"><span><svg class="icon"><use href="#i-list"/></svg><b data-i18n="view.details"></b></span></label><label><input type="radio" name="view" value="grid"><span><svg class="icon"><use href="#i-grid"/></svg><b data-i18n="view.grid"></b></span></label></div>
              </div>
              <label class="st-row click"><span class="st-ic"><svg class="icon"><use href="#i-eye"/></svg></span><span class="st-text"><b data-i18n="settings.showHidden"></b><small data-i18n="settings.d.hidden"></small></span><input type="checkbox" class="switch" id="set-hidden" role="switch"></label>
              <label class="st-row click"><span class="st-ic"><svg class="icon"><use href="#i-documents"/></svg></span><span class="st-text"><b data-i18n="settings.showExt"></b><small data-i18n="settings.d.ext"></small></span><input type="checkbox" class="switch" id="set-ext" role="switch"></label>
              <label class="st-row click"><span class="st-ic"><svg class="icon"><use href="#i-select"/></svg></span><span class="st-text"><b data-i18n="view.checks"></b><small data-i18n="settings.d.checks"></small></span><input type="checkbox" class="switch" id="set-checks" role="switch"></label>
            </div>

            <div class="st-label" data-i18n="settings.layout"></div>
            <div class="st-card">
              <label class="st-row click"><span class="st-ic"><svg class="icon"><use href="#i-panel-left"/></svg></span><span class="st-text"><b data-i18n="view.nav"></b><small data-i18n="settings.d.nav"></small></span><input type="checkbox" class="switch" id="set-nav" role="switch"></label>
              <label class="st-row click"><span class="st-ic"><svg class="icon"><use href="#i-folder-open"/></svg></span><span class="st-text"><b data-i18n="settings.autoTree"></b><small data-i18n="settings.d.autoTree"></small></span><input type="checkbox" class="switch" id="set-autotree" role="switch"></label>
              <label class="st-row click"><span class="st-ic"><svg class="icon"><use href="#i-panel-right"/></svg></span><span class="st-text"><b data-i18n="view.detailsPane"></b><small data-i18n="settings.d.details"></small></span><input type="checkbox" class="switch" id="set-details" role="switch"></label>
            </div>

            <div class="st-label" data-i18n="settings.safety"></div>
            <div class="st-card">
              <label class="st-row click"><span class="st-ic"><svg class="icon"><use href="#i-trash"/></svg></span><span class="st-text"><b data-i18n="settings.confirmDelete"></b><small data-i18n="settings.d.confirm"></small></span><input type="checkbox" class="switch" id="set-confirm" role="switch"></label>
            </div>
          </section>

          <section class="st-panel" data-panel="about" hidden>
            <div class="about-hero">
              <img src="assets/logo.svg" alt="" width="88" height="88">
              <div>
                <h4>Material File</h4>
                <p><span data-i18n="about.version"></span> <span id="app-version">1.0.0</span> · <span data-i18n="about.license"></span></p>
                <p class="muted" data-i18n="about.desc"></p>
              </div>
            </div>
            <div class="st-card">
              <div class="st-row">
                <span class="st-ic"><svg class="icon"><use href="#i-user"/></svg></span>
                <span class="st-text"><b data-i18n="about.author"></b><small data-i18n="about.authorDesc"></small></span>
                <span class="credit-chip">minhtrong67</span>
              </div>
              <div class="st-row">
                <span class="st-ic"><svg class="icon"><use href="#i-heart"/></svg></span>
                <span class="st-text"><b data-i18n="about.aiTitle"></b><small data-i18n="about.ai"></small></span>
                <span class="credit-chip ai">Claude</span>
              </div>
              <button class="st-row click" id="btn-github" type="button">
                <span class="st-ic"><svg class="icon"><use href="#i-open"/></svg></span>
                <span class="st-text"><b data-i18n="about.source"></b><small>github.com/minhtrong67/material-file</small></span>
                <svg class="icon chev"><use href="#i-chevron"/></svg>
              </button>
            </div>
            <p class="about-built" data-i18n="about.built"></p>
          </section>

        </div>
      </div>
    </div>
  </dialog>

  <!-- Properties -->
  <dialog id="dlg-props" class="dlg">
    <h2 data-i18n="props.title"></h2>
    <div class="props" id="props-body"></div>
    <div class="dlg-actions"><span class="grow"></span><button class="btn-filled" id="props-close" data-i18n="common.close"></button></div>
  </dialog>

  <!-- Prompt (batch rename) -->
  <dialog id="dlg-prompt" class="dlg">
    <h2 id="prm-title"></h2>
    <label class="field-label" id="prm-label" for="prm-input"></label>
    <input id="prm-input" class="field full" type="text" spellcheck="false" autocomplete="off">
    <div class="dlg-actions">
      <span class="grow"></span>
      <button class="btn-text" id="prm-cancel" data-i18n="common.cancel"></button>
      <button class="btn-filled" id="prm-ok" data-i18n="common.ok"></button>
    </div>
  </dialog>

  <!-- Generic confirm -->
  <dialog id="dlg-generic" class="dlg">
    <h2 id="dlg-title"></h2>
    <p id="dlg-message"></p>
    <div class="dlg-actions" id="dlg-actions"></div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
