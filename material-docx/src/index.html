<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f9ff" />
  <title>Material Docx</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <style id="print-style"></style>
</head>
<body class="view-print">
  <div id="app">
    <!-- Title bar: quick access, document name, search, theme, settings -->
    <header id="titlebar">
      <div class="brand" aria-hidden="true"><img class="logo" src="logo.svg" alt="" width="32" height="32" draggable="false" /></div>
      <div id="quick" class="quick"></div>
      <div class="doc-title">
        <input id="doc-name" type="text" spellcheck="false" maxlength="120" aria-label="Document name" />
        <span id="save-state" class="save-state"></span>
      </div>
      <div class="spacer"></div>
      <button class="search-pill" id="btn-search" type="button"></button>
      <button class="icon-btn" id="btn-theme" type="button"></button>
      <button class="icon-btn" id="btn-settings" type="button"></button>
    </header>

    <!-- Ribbon -->
    <nav id="tabs" role="tablist"></nav>
    <section id="ribbon" role="tabpanel"></section>

    <div id="body">
      <aside id="sidepane" hidden>
        <div class="side-head">
          <div class="seg" id="side-tabs"></div>
          <button class="icon-btn sm" id="side-close" type="button"></button>
        </div>
        <div id="side-content"></div>
      </aside>

      <div id="stage">
        <div id="findbar" hidden></div>
        <main id="workspace" tabindex="-1">
          <div id="ruler-wrap"><div id="ruler"></div></div>
          <div id="zoomer">
            <div id="sheet">
              <article id="editor" contenteditable="true" spellcheck="true" autocapitalize="off" role="textbox" aria-multiline="true"><p><br></p></article>
              <div id="overlay" aria-hidden="true"></div>
            </div>
          </div>
          <div id="img-handles" hidden></div>
        </main>
      </div>
    </div>

    <footer id="statusbar"></footer>

    <!-- File (backstage) view -->
    <div id="backstage" hidden></div>
  </div>

  <input type="file" id="file-image" accept="image/*" hidden />
  <input type="file" id="file-open" accept=".docx,.docm,.dotx,.dotm,.odt,.ott,.rtf,.html,.htm,.xhtml,.md,.markdown,.csv,.tsv,.txt,.text,.log" hidden />
  <div id="popup-layer"></div>
  <div id="snackbar" role="status" aria-live="polite"></div>
  <div id="drop-hint" hidden></div>

  <dialog id="dlg-confirm" class="dialog confirm">
    <div class="cf-badge" id="cf-badge" aria-hidden="true"></div>
    <h2 id="cf-title"></h2>
    <p id="cf-msg"></p>
    <div class="dlg-actions">
      <button class="btn text" id="cf-cancel" type="button"></button>
      <span class="spacer"></span>
      <button class="btn text" id="cf-no" type="button"></button>
      <button class="btn filled" id="cf-yes" type="button"></button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
