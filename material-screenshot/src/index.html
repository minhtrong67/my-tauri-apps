<div class="app">
  <div class="prog" id="prog" hidden></div>

  <header class="titlebar" data-tauri-drag-region>
    <svg class="i logo" aria-hidden="true"><use href="#i-logo"/></svg>
    <b class="app-name">Material Screenshot</b>
    <span class="file-name" id="fn"></span>
    <div class="wc" id="wc">
      <button id="wMin" tabindex="-1" data-t="minimize"><svg class="i"><use href="#i-min"/></svg></button>
      <button id="wMax" tabindex="-1" data-t="maximize"><svg class="i"><use id="wMaxUse" href="#i-max"/></svg></button>
      <button id="wClose" class="close" tabindex="-1" data-t="close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button class="btn tonal" id="bOpen"><svg class="i"><use href="#i-folder"/></svg><span data-i="open"></span></button>
    <button class="btn outlined" id="bPaste"><svg class="i"><use href="#i-paste"/></svg><span data-i="paste"></span></button>
    <button class="btn outlined" id="bCrop" disabled><svg class="i"><use href="#i-crop"/></svg><span data-i="crop"></span></button>
    <span class="vsep"></span>
    <button class="ib" id="bUndo" disabled data-t="undo"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="ib" id="bRedo" disabled data-t="redo"><svg class="i"><use href="#i-redo"/></svg></button>
    <span class="sp"></span>
    <button class="btn outlined" id="bCopy" disabled><svg class="i"><use href="#i-copy"/></svg><span data-i="copy"></span></button>
    <button class="btn filled" id="bSave" disabled><svg class="i"><use href="#i-download"/></svg><span data-i="save"></span></button>
    <span class="vsep"></span>
    <button class="ib" id="bSet" data-t="settings"><svg class="i"><use href="#i-settings"/></svg></button>
    <button class="ib" id="bAbout" data-t="about"><svg class="i"><use href="#i-info"/></svg></button>
  </div>

  <main class="main">
    <section id="stage">
      <canvas id="cv" hidden></canvas>
      <div id="empty">
        <div class="empty-in">
          <svg class="i hero" aria-hidden="true"><use href="#i-logo"/></svg>
          <h2 data-i="emptyT"></h2>
          <p data-i="emptyH"></p>
          <div class="row">
            <button class="btn filled" id="bOpen2"><svg class="i"><use href="#i-folder"/></svg><span data-i="open"></span></button>
            <button class="btn tonal" id="bPaste2"><svg class="i"><use href="#i-paste"/></svg><span data-i="paste"></span></button>
            <button class="btn text" id="bSample"><svg class="i"><use href="#i-image"/></svg><span data-i="sample"></span></button>
          </div>
          <div class="tips"><kbd>Ctrl</kbd>+<kbd>V</kbd><span data-i="tipPaste"></span><span class="dot"></span><span data-i="tipDrop"></span></div>
        </div>
        <div class="dropmsg"><svg class="i"><use href="#i-download"/></svg><span data-i="dropHere"></span></div>
      </div>
      <div id="cropbar" hidden>
        <span class="hint" data-i="cropHint"></span>
        <button class="btn filled" id="cOk" data-i="cropApply"></button>
        <button class="btn tonal" id="cReset" data-i="cropReset"></button>
        <button class="btn text" id="cNo" data-i="cropCancel"></button>
      </div>
    </section>
    <aside id="panel" aria-label="Options"></aside>
  </main>

  <footer class="status">
    <span id="sInfo"></span><span class="sp"></span><span id="sZoom"></span>
  </footer>
</div>

<dialog id="dSet"><div class="dlg">
  <div class="dlg-h"><svg class="i hi"><use href="#i-settings"/></svg><h2 data-i="settings"></h2><button class="ib" data-close data-t="close"><svg class="i"><use href="#i-close"/></svg></button></div>
  <div class="dlg-b" id="setBody"></div>
  <div class="dlg-a"><button class="btn filled" data-close data-i="ok"></button></div>
</div></dialog>

<dialog id="dAbout"><div class="dlg about">
  <div class="about-hero">
    <svg class="i big" aria-hidden="true"><use href="#i-logo"/></svg>
    <h2>Material Screenshot</h2>
    <div class="ver"><span data-i="version"></span> 1.1.0</div>
    <p class="tag" data-i="tagline"></p>
  </div>
  <div class="creators">
    <div class="cd author"><svg class="i"><use href="#i-code"/></svg><div><small data-i="author"></small><b>minhtrong67</b></div></div>
    <div class="cd aiby"><svg class="i"><use href="#i-sparkle"/></svg><div><small data-i="aiBy"></small><b>Claude</b><em>Anthropic</em></div></div>
  </div>
  <div class="chips-row"><span class="pill"><svg class="i"><use href="#i-heart"/></svg><span data-i="license"></span></span></div>
  <div class="dlg-a"><button class="btn filled" data-close data-i="ok"></button></div>
</div></dialog>

<div id="sb" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="fileBg" accept="image/*" hidden>
<input type="color" id="cc" hidden>

<script src="js/mcu.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
