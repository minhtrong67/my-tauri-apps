[package]
name = "code-image"
version = "1.0.0"
description = "Turn your code into beautiful images"
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# NOTE: [profile.*] lives in the workspace Cargo.toml one folder up.

[lib]
name = "code_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
