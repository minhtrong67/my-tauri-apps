name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings > About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or exported theme
      description: Drag and drop files here. Attach the .mtb.json project if the bug depends on a theme.
