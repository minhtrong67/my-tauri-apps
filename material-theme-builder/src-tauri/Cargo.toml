[package]
name = "material-theme-builder"
version = "1.0.0"
description = "Design, preview and export Material Design 3 color themes."
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"

[lib]
name = "material_theme_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
