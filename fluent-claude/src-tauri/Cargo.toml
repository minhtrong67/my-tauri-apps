[package]
name = "fluent-claude"
version = "1.0.0"
description = "Fluent Design dashboard that tracks Claude usage limits across Chrome profiles"
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"

# Mica / Mica Alt / Acrylic (chỉ Windows)
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
